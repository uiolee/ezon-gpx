[project]
name = "ezon-gpx"
version = "2.2.1"
description = "normalize Ezon gpx files."
readme = "README.md"
authors = [{ name = "uiolee" }]
requires-python = ">=3.15"
dependencies = []
keywords = ["ezon", "gpx", "xml", "running_page"]
license = { text = "MPL 2.0" }

classifiers = [
    "Development Status :: 4 - Beta",

    "Environment :: Console",

    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    'Intended Audience :: Healthcare Industry',

    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: File Formats",
    "Topic :: Utilities",


    "Natural Language :: English",

    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",

    "Programming Language :: Python :: 3.15",
]

[project.urls]
source = "https://github.com/uiolee/ezon-gpx.git"
issues = "https://github.com/uiolee/ezon-gpx/issues"

[project.scripts]
ezon-gpx = "ezon_gpx:cli.cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
